name: electric_battery_delivery_frontend
description: "Electric Battery Delivery Frontend App"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.5

  # HTTP requests
  http: ^1.2.0

  # Payment Integration
  razorpay_flutter: ^1.3.6

  # Location services
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  location: ^5.0.3
  permission_handler: ^11.2.0

  # WebSocket
  socket_io_client: ^3.0.2
  web_socket_channel: ^2.4.0

  # Notifications
  flutter_local_notifications: ^17.2.3

  # UI & Design
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  carousel_slider: ^4.1.1

  # Time formatting
  timeago: ^3.6.1

  # Phone number field and internationalization
  intl_phone_field: ^3.2.0
  intl: ^0.19.0

  # Storage
  shared_preferences: ^2.2.2

  # Google Maps Integration
  google_maps_flutter: ^2.5.3
  flutter_polyline_points: ^2.0.0
  url_launcher: ^6.2.4

  # Calendar Widget
  table_calendar: ^3.0.9

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # App Icon Generator
  flutter_launcher_icons: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Riverpod Generator
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.11

  # Linting
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    # - assets/images/
    # - assets/icons/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/user.png"
  remove_alpha_ios: true

dependency_overrides:
  carousel_slider: ^4.1.1